<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - PlantVerse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkout-container { display: flex; gap: 40px; margin-top: 120px; padding-bottom: 60px; }
        .checkout-form-section { flex: 2; }
        .checkout-summary { flex: 1; background: var(--bg-light); padding: 30px; border-radius: 8px; height: fit-content; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; font-family: var(--font-main); }
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }
        
        .section-heading { font-size: 1.2rem; color: var(--primary-color); margin: 30px 0 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .payment-methods { display: flex; flex-direction: column; gap: 10px; }
        .payment-method { border: 1px solid var(--border-color); padding: 15px; border-radius: 4px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .payment-method.active { border-color: var(--primary-color); background: #f1f8e9; }
        .payment-method img { height: 25px; }
        
        .checkout-item { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem; }
        .summary-total { font-size: 1.2rem; font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px; color: var(--primary-color); }
        
        @media (max-width: 768px) {
            .checkout-container { flex-direction: column-reverse; }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fas fa-leaf"></i> PlantVerse</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
            </ul>
        </div>
    </header>

    <div class="container checkout-container">
        <div class="checkout-form-section fade-in">
            <h2>Checkout</h2>
            
            <form id="checkout-form" onsubmit="event.preventDefault(); processCheckout();">
                <h3 class="section-heading">Shipping Address</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" class="form-control" required placeholder="Street address, P.O. box, etc.">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>State</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>ZIP / Postal Code</label>
                        <input type="text" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="form-control" required>
                </div>

                <h3 class="section-heading">Payment Method</h3>
                <div class="payment-methods">
                    <label class="payment-method active">
                        <input type="radio" name="payment" checked>
                        <i class="far fa-credit-card"></i> Credit / Debit Card
                    </label>
                    <label class="payment-method">
                        <input type="radio" name="payment">
                        <i class="fab fa-paypal"></i> PayPal
                    </label>
                    <label class="payment-method">
                        <input type="radio" name="payment">
                        <i class="fas fa-money-bill-wave"></i> Cash on Delivery
                    </label>
                </div>
                
                <div id="card-details" style="margin-top: 20px;">
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" class="form-control" placeholder="XXXX XXXX XXXX XXXX">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Expiry Date</label>
                            <input type="text" class="form-control" placeholder="MM/YY">
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="text" class="form-control" placeholder="123">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 30px; font-size: 1.1rem; padding: 15px;">Place Order</button>
            </form>
        </div>
        
        <div class="checkout-summary fade-in">
            <h3 style="margin-bottom: 20px;">Order Summary</h3>
            <div id="checkout-items" style="margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">
                <!-- Items -->
            </div>
            
            <div class="checkout-item"><span>Subtotal</span><span id="co-subtotal">₹0</span></div>
            <div class="checkout-item"><span>Shipping</span><span id="co-shipping">₹0</span></div>
            <div class="checkout-item"><span>Tax</span><span id="co-tax">₹0</span></div>
            
            <div class="checkout-item summary-total"><span>Total</span><span id="co-total">₹0</span></div>
        </div>
    </div>

    <!-- Modals -->
    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="success-modal">
        <div class="modal-content" style="text-align:center;">
            <i class="fas fa-check-circle" style="font-size: 4rem; color: var(--secondary-color); margin-bottom: 20px;"></i>
            <h2 style="color: var(--primary-color);">Order Placed Successfully!</h2>
            <p style="margin: 20px 0; color: var(--text-light);">Thank you for your purchase. Your order has been confirmed.</p>
            <a href="index.html" class="btn">Back to Home</a>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const itemsContainer = document.getElementById('checkout-items');
            
            if(cart.length === 0) {
                window.location.href = 'shop.html';
                return;
            }
            
            let subtotal = 0;
            itemsContainer.innerHTML = cart.map(item => {
                const st = item.price * item.quantity;
                subtotal += st;
                return `<div class="checkout-item"><span style="color:var(--text-light);">${item.name} x ${item.quantity}</span><span style="font-weight:600;">₹${st}</span></div>`;
            }).join('');
            
            const shipping = subtotal > 999 ? 0 : 150;
            const tax = Math.round(subtotal * 0.18);
            const total = subtotal + shipping + tax;
            
            document.getElementById('co-subtotal').innerText = `₹${subtotal}`;
            document.getElementById('co-shipping').innerText = shipping === 0 ? 'Free' : `₹${shipping}`;
            document.getElementById('co-tax').innerText = `₹${tax}`;
            document.getElementById('co-total').innerText = `₹${total}`;
            
            // Payment method toggle
            const radios = document.querySelectorAll('input[name="payment"]');
            radios.forEach(r => {
                r.addEventListener('change', (e) => {
                    document.querySelectorAll('.payment-method').forEach(pm => pm.classList.remove('active'));
                    e.target.closest('.payment-method').classList.add('active');
                    
                    const cardDetails = document.getElementById('card-details');
                    if(e.target.parentElement.innerText.includes('Card')) {
                        cardDetails.style.display = 'block';
                        cardDetails.querySelectorAll('input').forEach(i => i.required = true);
                    } else {
                        cardDetails.style.display = 'none';
                        cardDetails.querySelectorAll('input').forEach(i => i.required = false);
                    }
                });
            });
            
            window.processCheckout = function() {
                document.getElementById('success-modal').classList.add('active');
                localStorage.removeItem('cart');
                cart = []; // clear local array
                updateCartCount();
            };
        });
    </script>
</body>
</html>
