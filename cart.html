<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - PlantVerse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .cart-page-container { margin-top: 120px; min-height: 50vh; display: flex; gap: 40px; margin-bottom: 60px; }
        .cart-main { flex: 2; }
        .cart-summary { flex: 1; background: var(--bg-light); padding: 30px; border-radius: 8px; height: fit-content; }
        
        .cart-table { width: 100%; border-collapse: collapse; }
        .cart-table th { text-align: left; padding: 15px; border-bottom: 2px solid var(--border-color); color: var(--text-light); }
        .cart-table td { padding: 20px 15px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        
        .cart-product-info { display: flex; align-items: center; gap: 15px; }
        .cart-product-info img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .summary-total { font-size: 1.2rem; font-weight: bold; border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px; }
        
        .coupon-box { display: flex; margin-bottom: 30px; }
        .coupon-box input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px 0 0 4px; }
        .coupon-box button { border-radius: 0 4px 4px 0; }
        
        @media (max-width: 768px) {
            .cart-page-container { flex-direction: column; }
            .cart-table thead { display: none; }
            .cart-table td { display: block; text-align: right; }
            .cart-table td:before { content: attr(data-label); float: left; font-weight: bold; }
            .cart-product-info { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="header">
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fas fa-leaf"></i> PlantVerse</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
            </ul>
            <div class="nav-icons">
                <a href="wishlist.html" id="heart-icon"><i class="far fa-heart"></i><span class="badge" id="wishlist-count">0</span></a>
                <div id="cart-icon"><i class="fas fa-shopping-cart"></i><span class="badge" id="cart-count">0</span></div>
            </div>
        </div>
    </header>

    <div class="container cart-page-container">
        <div class="cart-main">
            <h2 style="margin-bottom: 30px; color: var(--primary-color);">Shopping Cart</h2>
            <table class="cart-table" id="main-cart-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="cart-page-items">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
        
        <div class="cart-summary fade-in">
            <h3 style="margin-bottom: 20px;">Order Summary</h3>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="summary-subtotal">₹0</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span id="summary-shipping">₹0</span>
            </div>
            <div class="summary-row">
                <span>Tax (18%)</span>
                <span id="summary-tax">₹0</span>
            </div>
            
            <div class="summary-row summary-total">
                <span>Total</span>
                <span id="summary-total" style="color:var(--primary-color);">₹0</span>
            </div>
            
            <div style="margin-top: 30px;">
                <p style="font-size: 0.9rem; margin-bottom: 10px;">Have a coupon?</p>
                <div class="coupon-box">
                    <input type="text" placeholder="Coupon Code">
                    <button class="btn btn-outline">Apply</button>
                </div>
            </div>
            
            <a href="checkout.html" class="btn" style="width: 100%; text-align: center; font-size: 1.1rem; padding: 15px;">Proceed to Checkout</a>
        </div>
    </div>

    <!-- Modals and Toasts (reused) -->
    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="modal-overlay-cart" style="z-index: 2400;"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header"><h3>Your Cart</h3><i class="fas fa-times close-cart" id="close-cart"></i></div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total"><span>Total:</span><span id="cart-total-price">₹0</span></div>
            <a href="checkout.html" class="btn" style="width:100%;">Checkout</a>
        </div>
    </div>

    <footer>
        <div class="container" style="text-align: center; padding: 20px;">
            <p>&copy; 2026 PlantVerse.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tbody = document.getElementById('cart-page-items');
            const subtotalEl = document.getElementById('summary-subtotal');
            const shippingEl = document.getElementById('summary-shipping');
            const taxEl = document.getElementById('summary-tax');
            const totalEl = document.getElementById('summary-total');
            
            function renderCartPage() {
                if(cart.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px;">Your cart is empty. <a href="shop.html" style="color:var(--primary-color); text-decoration:underline;">Continue shopping</a></td></tr>';
                    subtotalEl.innerText = '₹0';
                    shippingEl.innerText = '₹0';
                    taxEl.innerText = '₹0';
                    totalEl.innerText = '₹0';
                    return;
                }
                
                let subtotal = 0;
                tbody.innerHTML = cart.map(item => {
                    const st = item.price * item.quantity;
                    subtotal += st;
                    return `
                        <tr>
                            <td data-label="Product">
                                <div class="cart-product-info">
                                    <img src="${item.image}" alt="${item.name}">
                                    <div>
                                        <h4 style="margin-bottom:5px;">${item.name}</h4>
                                        <div style="font-size:0.85rem; color:var(--text-light);">${item.category}</div>
                                    </div>
                                </div>
                            </td>
                            <td data-label="Price" style="font-weight:600;">₹${item.price}</td>
                            <td data-label="Quantity">
                                <div class="qty-control" style="margin-bottom:0;">
                                    <button class="qty-btn" onclick="updateCartPage(${item.id}, -1)">-</button>
                                    <span>${item.quantity}</span>
                                    <button class="qty-btn" onclick="updateCartPage(${item.id}, 1)">+</button>
                                </div>
                            </td>
                            <td data-label="Subtotal" style="font-weight:600; color:var(--primary-color);">₹${st}</td>
                            <td data-label="Remove" style="text-align:center;">
                                <i class="fas fa-trash" style="color:#f44336; cursor:pointer;" onclick="removeCartPage(${item.id})"></i>
                            </td>
                        </tr>
                    `;
                }).join('');
                
                const shipping = subtotal > 999 ? 0 : 150;
                const tax = Math.round(subtotal * 0.18);
                const grandTotal = subtotal + shipping + tax;
                
                subtotalEl.innerText = `₹${subtotal}`;
                shippingEl.innerText = shipping === 0 ? 'Free' : `₹${shipping}`;
                taxEl.innerText = `₹${tax}`;
                totalEl.innerText = `₹${grandTotal}`;
            }
            
            window.updateCartPage = function(id, delta) {
                updateQuantity(id, delta);
                renderCartPage();
            };
            window.removeCartPage = function(id) {
                removeFromCart(id);
                renderCartPage();
            };
            
            renderCartPage();
        });
    </script>
</body>
</html>
